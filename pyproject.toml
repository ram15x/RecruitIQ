[project]
name = "recruitiq"
version = "2.0.0"
description = "Explainable resume screening where a person makes every decision"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "email-validator>=2.1",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "rapidfuzz>=3.6",
  "pyyaml>=6.0",
  "fpdf2>=2.7",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "httpx>=0.27",
]

[project.optional-dependencies]
ui = ["streamlit>=1.50", "pandas>=2.1"]
dense = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "ruff>=0.5"]
postgres = ["psycopg[binary]>=3.1"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E701", "E702", "E731", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::jwt.warnings.InsecureKeyLengthWarning"]
