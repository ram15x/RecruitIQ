# Skill ontology. Each entry: a canonical name, the ways people write it, the group it belongs to,
# and "related" skills that count as partial evidence (someone with PyTorch is close to TensorFlow, not the same).
# Aliases are matched as whole words, case-insensitive. Keep aliases specific: a short alias that is also an
# ordinary word ("go", "r", "c") is written in a form that is hard to hit by accident, see core/skills.py.

python:        {group: programming, aliases: [python, python3, py3], related: [r, julia]}
