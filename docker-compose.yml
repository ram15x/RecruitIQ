services:
  api:
    build: .
    command: uvicorn recruitiq.api.app:app_factory --factory --host 0.0.0.0 --port 8000
    env_file: .env
    volumes: ["recruitiq-data:/data"]
    ports: ["8000:8000"]
  ui:
    build: .
    command: streamlit run recruitiq/ui/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      RECRUITIQ_API_URL: http://api:8000
    depends_on: [api]
    ports: ["8501:8501"]
volumes:
  recruitiq-data:
